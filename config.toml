# Configuration centrale de JARVIS.
# Les chemins relatifs sont résolus par rapport au dossier de ce fichier.

[assistant]
language = "fr"
# Personnalité : nom, titre de l'utilisateur, ton, phrases et réponses prédéfinies.
personality = "personality.toml"
# Durée (s) pendant laquelle JARVIS reste à l'écoute après une réponse,
# sans qu'il soit nécessaire de répéter le wake word.
conversation_timeout = 8.0
# Nombre maximal d'échanges conservés dans le contexte d'une conversation.
max_history_turns = 6

[wake_word]
# Mot affiché/utilisé dans les messages ; le modèle ci-dessous fait la détection.
phrase = "Jarvis"
# Classifieur openWakeWord entraîné dans ce dépôt pour « Jarvis » prononcé à la française
# (python -m wakeword_training all). Pour un autre mot : entraîner un modèle et pointer ici.
model = "models/openwakeword/jarvis_fr.onnx"
melspectrogram_model = "models/openwakeword/melspectrogram.onnx"
embedding_model = "models/openwakeword/embedding_model.onnx"
# Score (0-1) au-delà duquel le wake word est considéré comme détecté.
# 0.96 = seuil recommandé par l'évaluation (models/openwakeword/jarvis_fr.json) : le plus bas
# qui garde < 0,5 fausse alerte/h et < 3 % de mots pièges déclencheurs sur des voix de test.
# À ajuster avec `python -m jarvis --wake-test` : plus bas = détecte mieux de loin, se trompe plus.
threshold = 0.80

[stt]
# Modèle faster-whisper : tiny, base, small, medium... ("small" = bon compromis FR).
model = "small"
# "auto" : GPU NVIDIA s'il est utilisable (float16, voir requirements-gpu.txt), sinon CPU (int8).
# Le même fichier fonctionne donc sur le PC et sur le mini-PC. Forcer avec "cuda" ou "cpu".
device = "auto"
compute_type = "auto"
beam_size = 1
download_root = "models/whisper"
# Utilisé si CUDA est indisponible (pas de GPU NVIDIA, bibliothèque manquante...).
fallback_device = "cpu"
fallback_compute_type = "int8"
# Indique à Whisper le vocabulaire attendu (« Jarvis », noms des applications autorisées dans [tools]) :
# « ouvre Steam » est moins souvent entendu « ouvre-ste-iem ». Les commandes encore mal transcrites
# (« ou vos teams ») sont ensuite corrigées si elles ressemblent nettement à une commande connue.
vocabulary_hint = true

[tts]
# Moteur de synthèse, 100 % local : "piper" (rapide, défaut) ou "neutts" (NeuTTS Nano French,
# voix plus naturelle mais ~1,2 fois plus lente que le temps réel sur le CPU ; voir [tts.neutts]).
engine = "piper"
# Voix Piper (https://huggingface.co/rhasspy/piper-voices). Le .onnx.json doit être à côté.
voice = "models/piper/fr_FR-tom-medium.onnx"
# Locuteur des voix multi-locuteurs (ex. "pierre" pour fr_FR-upmc-medium) ; vide sinon.
speaker = ""
length_scale = 1.0      # > 1 = plus lent
volume = 1.0
# true : lecture par morceaux pendant la synthèse (NeuTTS seulement ; hache la voix si le CPU est trop lent).
stream_audio = false
# Une phrase de moins de N caractères est synthétisée avec la suivante, pour éviter un silence
# quand le moteur est lent (utile avec NeuTTS : 40). 0 : désactivé.
merge_under = 0

[tts.pronunciations]
# Mot = phonèmes espeak (IPA) imposés à Piper. espeak lit « Jarvis » /ʒaʁvˈi/
# (s final muet, règle du français) : on impose /ʒaʁvˈis/ sans changer l'orthographe.
Jarvis = "ʒaʁvˈis"

[tts.neutts]
# Utilisé seulement avec engine = "neutts" (dépendances : requirements-neutts.txt).
# Modèles soumis à licence sur Hugging Face : accepter les conditions puis mettre HF_TOKEN dans .env.
backbone = "neuphonic/neutts-nano-french-q8-gguf"
codec = "neuphonic/neucodec-onnx-decoder"
# Voix clonée : WAV de 3 à 15 s + transcription exacte dans le .txt du même nom.
voice = "models/neutts/voices/bernard.wav"
# Orthographe prononcée par NeuTTS (mot entier, sans tenir compte des majuscules).
pronunciations = { Jarvis = "Jarvisse" }

[llm]
backend = "ollama"
host = "http://127.0.0.1:11434"
# À adapter au matériel : sur un mini-PC sans GPU, un modèle 3-4B (ex. qwen2.5:3b,
# llama3.2:3b) est plus réactif qu'un 7B.
model = "mistral:latest"
# Bas = réponses plus sobres et centrées sur la demande ; haut = plus créatif et dispersé.
temperature = 0.3
max_tokens = 200
keep_alive = "30m"
timeout = 120.0

[web]
# Recherche Web pour les questions d'actualité (prix, versions, nouvelles...), via une instance
# SearXNG auto-hébergée (format json activé). Si le service est injoignable, JARVIS le dit simplement.
enabled = true
provider = "searxng"
base_url = "http://127.0.0.1:8080"
language = "fr"
max_results = 5         # résultats demandés au moteur ; seuls les 3 plus pertinents vont au LLM
timeout = 10.0
fetch_pages = 1         # pages lues en entier pour compléter les extraits (0 = extraits seulement)
max_page_bytes = 1000000

[tools]
# Outils : JARVIS agit sur le PC via des outils enregistrés, jamais via un shell. Le LLM propose un outil,
# JARVIS valide, applique le niveau de risque de l'outil (SAFE : exécuté ; à confirmer : question ;
# RESTRICTED : refusé) et rapporte le résultat réel. Chaque outil : enabled = true/false.
# confirm = true ajoute une confirmation à un outil SAFE ; elle ne peut jamais être retirée à un outil
# qui l'exige (fermer une application, verrouiller le PC).
enabled = true
timeout = 15.0          # délai maximal d'exécution d'un outil (s)

[tools.get_time]
enabled = true

[tools.get_date]
enabled = true

[tools.system_info]
enabled = true

[tools.open_url]
enabled = true          # SAFE : pas de confirmation (http/https uniquement)

[tools.open_application]
enabled = true          # SAFE : pas de confirmation

[tools.close_application]
enabled = true          # confirmation obligatoire

[tools.list_running_applications]
enabled = true

[tools.set_volume]
enabled = true

[tools.mute_volume]
enabled = true

[tools.unmute_volume]
enabled = true

[tools.lock_pc]
enabled = true          # confirmation obligatoire

# Applications que JARVIS peut ouvrir, fermer et surveiller : seule cette liste fait foi.
# Les applications du catalogue de JARVIS sont trouvées automatiquement (registre Windows,
# emplacements habituels, Microsoft Store) ; executable = "..." impose un chemin.
# Application hors catalogue : executable (chemin absolu) et process (nom du processus) requis, ex. :
# [tools.applications.obs]
# label = "OBS Studio"
# executable = "C:/Program Files/obs-studio/bin/64bit/obs64.exe"
# process = "obs64.exe"
[tools.applications.discord]
enabled = true

[tools.applications.steam]
enabled = true

[tools.applications.chrome]
enabled = true

[tools.applications.spotify]
enabled = true

[tools.applications.vscode]
enabled = true

[tools.applications.notepad]
enabled = true

[activity]
# Journal d'activité (actions des outils réussies ou échouées), une ligne JSON par événement.
# Consulter : python -m jarvis --activity
enabled = true
path = "data/activity.jsonl"
max_kb = 1024           # au-delà, le fichier est archivé en activity.1.jsonl

[face]
# Visage graphique animé (page Web locale). Non critique : si le port est pris ou la page fermée,
# JARVIS continue en vocal. host = "0.0.0.0" pour l'afficher sur une tablette ou un écran du réseau local.
enabled = true
host = "127.0.0.1"
port = 8765
open_browser = true     # ouvre la page dans le navigateur au lancement

[audio]
sample_rate = 16000
# Taille d'un bloc audio : 1280 échantillons = 80 ms (attendu par openWakeWord).
frame_samples = 1280
# Micro et sortie de JARVIS, indépendants de ceux de Windows. Pour choisir dans une liste :
#   python -m jarvis --choose-audio
input_device = "Microphone (Voicemod Virtual Au, MME"       # vide = périphérique par défaut de Windows ; sinon nom partiel ou index
output_device = "Chat (2- TC-HELICON GoXLR), MME"
# Délai max (s) pour commencer à parler après "Oui, monsieur ?".
listen_timeout = 6.0
# Silence (s) marquant la fin d'une phrase.
end_of_speech_silence = 0.9
max_utterance = 15.0
# Détection de parole par énergie : seuil = max(min_rms, bruit_de_fond * ratio).
min_rms = 300.0
speech_to_noise_ratio = 3.0
