# Réglages SearXNG pour ORION : valeurs par défaut + ce dont ORION a besoin.
use_default_settings: true

general:
  instance_name: "ORION"

server:
  # Instance privée, locale : pas de limitation de débit ni de proxy d'images.
  limiter: false
  image_proxy: false

search:
  # ORION interroge l'API JSON (format désactivé par défaut dans SearXNG).
  formats:
    - html
    - json
  safe_search: 1
  default_lang: "fr"
